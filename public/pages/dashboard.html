<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Dashboard — GIIAS 2026</title>
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>

<div class="container">
  
  <!-- NAV -->
  <nav class="nav">
    <a href="/" class="brand-badge">GIIAS 2026</a>
    <div class="search-box">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="search" placeholder="Search for name or ID..." autocomplete="off">
    </div>
    <div class="nav-actions">
      <div class="export-wrap" style="position: relative;">
        <button class="btn-icon" id="export-btn" title="Export Data">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <div class="export-menu" id="export-menu" style="display: none; position: absolute; right: 0; top: calc(100% + 8px); background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-md); padding: 8px; width: 140px; z-index: 100; box-shadow: var(--shadow);">
          <button class="export-item" id="exp-csv">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> CSV
          </button>
          <button class="export-item" id="exp-print">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print
          </button>
        </div>
      </div>
      <div class="btn-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      </div>
      <a href="/" class="btn-icon" title="Home">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
    </div>
  </nav>

  <!-- SUMMARY CARDS -->
  <div class="summary-grid">
    <div class="summary-card">
      <div class="summary-card__header">Total Sessions <span>ⓘ</span></div>
      <div class="summary-card__val" id="sum-total">0</div>
      <div class="summary-card__sub"><span class="summary-card__sub-icon">⚡</span> <span id="sum-sub-total">0/h</span></div>
      <div class="mock-chart"><div class="mock-bar" style="height:30%"></div><div class="mock-bar" style="height:50%"></div><div class="mock-bar" style="height:40%"></div><div class="mock-bar" style="height:70%"></div><div class="mock-bar" style="height:60%"></div><div class="mock-bar" style="height:90%"></div><div class="mock-bar" style="height:80%"></div></div>
      <div class="chart-labels">
        <span class="chart-label">1D</span><span class="chart-label">7D</span><span class="chart-label">1M</span><span class="chart-label">ALL</span>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-card__header">Average Score <span>ⓘ</span></div>
      <div class="summary-card__val" id="sum-active">0</div>
      <div class="summary-card__sub"><span class="summary-card__sub-icon">🟢</span> <span id="sum-sub-active">0 Events</span></div>
      <div class="mock-chart"><div class="mock-bar" style="height:20%"></div><div class="mock-bar" style="height:30%"></div><div class="mock-bar" style="height:40%"></div><div class="mock-bar" style="height:30%"></div><div class="mock-bar" style="height:50%"></div><div class="mock-bar" style="height:60%"></div><div class="mock-bar" style="height:40%"></div></div>
      <div class="chart-labels">
        <span class="chart-label">1D</span><span class="chart-label">7D</span><span class="chart-label">1M</span><span class="chart-label">ALL</span>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-card__header">Top Score <span>ⓘ</span></div>
      <div class="summary-card__val" id="sum-upcoming">0</div>
      <div class="summary-card__sub"><span class="summary-card__sub-icon">🔵</span> <span id="sum-sub-upcoming">0 Events</span></div>
      <div class="mock-chart"><div class="mock-bar" style="height:40%"></div><div class="mock-bar" style="height:40%"></div><div class="mock-bar" style="height:40%"></div><div class="mock-bar" style="height:50%"></div><div class="mock-bar" style="height:50%"></div><div class="mock-bar" style="height:50%"></div><div class="mock-bar" style="height:60%"></div></div>
      <div class="chart-labels">
        <span class="chart-label">1D</span><span class="chart-label">7D</span><span class="chart-label">1M</span><span class="chart-label">ALL</span>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-card__header">Total Players <span>ⓘ</span></div>
      <div class="summary-card__val" id="sum-participants">0</div>
      <div class="summary-card__sub"><span class="summary-card__sub-icon">👥</span> <span id="sum-sub-participants">0 Joined</span></div>
      <div class="mock-chart"><div class="mock-bar" style="height:80%"></div><div class="mock-bar" style="height:20%"></div><div class="mock-bar" style="height:30%"></div><div class="mock-bar" style="height:25%"></div><div class="mock-bar" style="height:30%"></div><div class="mock-bar" style="height:30%"></div><div class="mock-bar" style="height:20%"></div></div>
      <div class="chart-labels">
        <span class="chart-label">1D</span><span class="chart-label">7D</span><span class="chart-label">1M</span><span class="chart-label">ALL</span>
      </div>
    </div>
  </div>

  <!-- FEED -->
  <div class="feed-header">
    <div class="feed-title-wrap">
      <div class="feed-title">Activity Feed</div>
      <div class="live-badge"><span class="live-dot"></span> Live Data</div>
    </div>
    <div class="feed-controls" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
      <select class="brand-select" id="sort-select" title="Sort">
        <option value="date-desc">Sort: Newest</option>
        <option value="date-asc">Sort: Oldest</option>
        <option value="score-desc">Sort: High Score</option>
        <option value="score-asc">Sort: Low Score</option>
        <option value="name-asc">Sort: Name A-Z</option>
      </select>
      
      <div class="filter-wrap" style="position: relative;">
        <button class="brand-select" id="filter-btn" style="background-image: none; padding-right: 16px; display: flex; align-items: center; gap: 8px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg> Filter
        </button>
        <div class="filter-panel" id="filter-panel" style="display: none; position: absolute; right: 0; top: calc(100% + 8px); background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px; width: 220px; z-index: 100; box-shadow: var(--shadow);">
          <div style="margin-bottom: 12px;">
            <label style="display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 4px;">Start Date</label>
            <input type="date" id="date-from" class="search-input" style="padding: 6px 10px; font-size: 11px;">
          </div>
          <div style="margin-bottom: 12px;">
            <label style="display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 4px;">End Date</label>
            <input type="date" id="date-to" class="search-input" style="padding: 6px 10px; font-size: 11px;">
          </div>
          <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 4px;">Rows per page</label>
            <input type="number" id="limit-input" value="8" min="1" max="50" class="search-input" style="padding: 6px 10px; font-size: 11px;">
          </div>
          <div style="display: flex; gap: 8px;">
            <button id="apply-btn" class="btn-apply">Apply</button>
            <button id="reset-btn" class="btn-reset">Reset</button>
          </div>
        </div>
      </div>

      <select class="brand-select" id="brand-select" title="Brand">
        <option value="all">Brand: All</option>
        <option value="microsite">Brand: Microsite</option>
        <option value="mlf">Brand: MLF</option>
        <option value="hyundai">Brand: Hyundai</option>
        <option value="mazda">Brand: Mazda</option>
        <option value="polytron">Brand: Polytron</option>
        <option value="jetour">Brand: Jetour</option>
        <option value="vinfast">Brand: Vinfast</option>
        <option value="byd">Brand: BYD</option>
        <option value="fuso">Brand: Fuso</option>
      </select>
    </div>
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>Mint# / ID</th>
          <th>Activity ID <span>ⓘ</span></th>
          <th>Address / Phone</th>
          <th>Time Score <span>ⓘ</span></th>
          <th>Date</th>
          <th style="text-align:right">Actions</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Rendered via JS -->
      </tbody>
    </table>
  </div>

  <div class="pagination" id="pagination">
    <!-- Rendered via JS -->
  </div>

</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
